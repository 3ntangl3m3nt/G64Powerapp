"avRequestScreen As screen.'headerFormLayout_ver1.0'":
    BackgroundImage: =insignia3
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |
        =Set(myGUID, GUID());
        Set(varDigits, FirstN(
            Filter(
                ForAll(Split(Text(myGUID), ""), {Value: Text(Value)}),
                IsNumeric(Value)
            ),
            5
